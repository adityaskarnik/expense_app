
{% extends 'base.html' %}
{% load static %}
{% block content %}
{% if user.is_authenticated %}

{% else %}
<script language="javascript">
    window.location.href = "/"
</script>
{% endif %}
<!-- Main content -->
<div class="content-wrapper">
    <div class="d-flex">
        <div class="breadcrumb">
            <a href="/expense_app/" class="breadcrumb-item"><i class="icon-coins mr-2"></i> All Expenses</a>
        </div>
    
        <!-- <a href="#" class="header-elements-toggle text-default d-md-none"><i class="icon-more"></i></a> -->
    </div>
    <!-- Basic initialization -->
    <div class="card">
        <div class="table-responsive">
            <table id="expense_table" class="table datatable-fixed-left">
                <thead>
                </thead>    
                <tbody>
                </tbody>
            </table>
        </div>
    </div>

    <div id="modal-edit-expense" class="modal fade" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-slate-800">
                    <h6 class="modal-title">Add Transaction</h6>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>

                <!-- Form -->
                <form class="modal-body" action="/add_expense/" method="POST" id="post-form">
                    {% csrf_token %}
                    <input type="hidden" id="expense_id" name="expense_id" value="">
                    <div class="form-group form-group-feedback form-group-feedback-left">
                        <input id="account" type="text" class="form-control" readonly="true" value="Personal Expense" name="account">
                        <div class="form-control-feedback">
                            <i class="icon-notebook text-muted"></i>
                        </div>
                    </div>
                    <div class="form-group form-group-feedback form-group-feedback-left">
                        <input id="datesingle" type="text" class="form-control" name="date">
                        <div class="form-control-feedback">
                            <i class="icon-calendar22 text-muted"></i>
                        </div>
                    </div>
                    <div class="form-group form-group-feedback form-group-feedback-left">
                        <input id="amount" type="number" step="0.01" class="form-control" placeholder="Amount" name="amount">
                        <div class="form-control-feedback">
                            ₹
                        </div>
                    </div>
                    <div class="form-group form-group-feedback form-group-feedback-left">
                        <input id="payee" type="text" class="form-control" placeholder="Payee/Payer" name="payee">
                        <div class="form-control-feedback">
                            <i class="icon-person text-muted"></i>
                        </div>
                    </div>
                    <div class="form-group form-group-feedback form-group-feedback-left">
                        <select id="category" class="form-control" placeholder="Category" name="category">
                            <option value="" disabled selected hidden>Category</option>
                            <option value="Automobile">Automobile</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Family">Family</option>
                            <option value="Food">Food</option>
                            <option value="Health Care">Health Care</option>
                            <option value="Home Office">Home Office</option>
                            <option value="Household">Household</option>
                            <option value="Insurance">Insurance</option>
                            <option value="Loans">Loans</option>
                            <option value="Other">Other</option>
                            <option value="Personal">Personal</option>
                            <option value="Savings">Savings</option>
                            <option value="Tax">Tax</option>
                            <option value="Travel">Travel</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Vacation">Vacation</option>
                            <option value="Unknown">Unknown</option>
                        </select>
                        <div class="form-control-feedback">
                            <i class="icon-stack-empty text-muted"></i>
                        </div>
                    </div>
                    <div class="form-group form-group-feedback form-group-feedback-left">
                        <select id="sub-category" class="form-control" placeholder="Sub Category" name="subcategory">
                            <option value="" disabled selected hidden>Sub Category</option>
                        </select>
                        <div class="form-control-feedback">
                            <i class="icon-stack-empty text-muted"></i>
                        </div>
                    </div>
                    <div class="form-group form-group-feedback form-group-feedback-left" id="custom-subcategory-group" style="display:none;">
                        <input id="custom-subcategory" type="text" class="form-control" placeholder="Enter new sub category" name="custom_subcategory" disabled>
                        <div class="form-control-feedback">
                            <i class="icon-plus-circle2 text-muted"></i>
                        </div>
                    </div>
                    <div class="form-group form-group-feedback form-group-feedback-left">
                        <select id="method" class="form-control" placeholder="Payment Method" name="method">
                            <option value="" disabled selected hidden>Payment Method</option>
                            <option value="Cash">Cash</option>
                            <option value="Check">Check</option>
                            <option value="Credit Card">Credit Card</option>
                            <option value="Debit">Debit</option>
                            <option value="Electronic Transfer">Electronic Transfer</option>
                        </select>
                        <div class="form-control-feedback">
                            <i class="icon-credit-card2 text-muted"></i>
                        </div>
                    </div>
                    <div class="form-group form-group-feedback form-group-feedback-left">
                        <select id="status" class="form-control" placeholder="Status" name="status">
                            <option value="" disabled selected hidden>Status</option>
                            <option value="Cleared">Cleared</option>
                            <option value="Uncleared">Uncleared</option>
                        </select>
                        <div class="form-control-feedback">
                            <i class="icon-check2 text-muted"></i>
                        </div>
                    </div>
                    <div class="form-group form-group-feedback form-group-feedback-left">
                        <input id="check-no" type="text" class="form-control" placeholder="Ref/Check No" name="checkno">
                        <div class="form-control-feedback">
                            <i class="icon-pencil7 text-muted"></i>
                        </div>
                    </div>
                    <div class="form-group form-group-feedback form-group-feedback-left">
                        <select id="tag" class="form-control" placeholder="Tag" name="tag">
                            <option value="" disabled selected hidden>Tag</option>
                            <option value="Business">Business</option>
                            <option value="Vacation">Vacation</option>
                            <option value="Project">Project</option>
                            <option value="Client">Client</option>
                        </select>
                        <div class="form-control-feedback">
                            <i class="icon-price-tag2 text-muted"></i>
                        </div>
                    </div>
                    <div class="form-group form-group-feedback form-group-feedback-left">
                        <input id="tax" type="text" class="form-control" placeholder="Tax" name="tax">
                        <div class="form-control-feedback">
                            <i class="icon-calculator3 text-muted"></i>
                        </div>
                    </div>
                    <div class="form-group form-group-feedback form-group-feedback-left">
                        <input id="description" type="text" class="form-control" placeholder="Description" name="description">
                        <div class="form-control-feedback">
                            <i class="icon-file-text2 text-muted"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary btn-block">OK <i class="icon-circle-right2 ml-2"></i></button>
                    </div>
                </form>
                <!-- /form -->

            </div>
        </div>
    </div>
    <!-- /basic initialization -->


</div>
<!-- /main content -->

<script type="text/javascript" language="javascript" class="init">
    $(document).ready(function() {
        // Category to subcategory mapping from CATEGORY_RULES
        const categorySubcategories = {
            "Automobile": ["Fuel", "Maintenance", "Insurance"],
            "Entertainment": ["Streaming", "Movies", "Gaming", "Other"],
            "Food": ["Restaurant", "Grocery"],
            "Health Care": ["Medical", "Pharmacy", "Consultation", "Health Insurance", "Hospital", "Insurance"],
            "Home Office": ["Other"],
            "Household": ["Rent", "Maintenance", "Furniture", "Groceries", "Maintenance Services"],
            "Insurance": ["Life"],
            "Personal": ["Clothing", "Grooming", "Personal Care", "Others"],
            "Savings": ["RD", "PPF", "Investments", "Fixed Deposit"],
            "Travel": ["Taxi", "Fuel", "Transit", "Airplane", "Train"],
            "Utilities": ["Telephone", "Internet", "Electricity", "Gas", "Water"],
            "Vacation": ["Hotel", "Other"],
            "Family": ["Other"],
            "Loans": ["Other"],
            "Tax": ["Other"],
            "Unknown": ["Unknown"],
            "Other": ["Other"]
        };

        function populateSubcategories(categoryName) {
            const subcategorySelect = $("#modal-edit-expense #sub-category");
            subcategorySelect.html('<option value="" disabled selected hidden>Sub Category</option>');
            
            if (!categoryName || !categorySubcategories[categoryName]) {
                return;
            }
            
            const subcategories = categorySubcategories[categoryName];
            subcategories.forEach(subcat => {
                subcategorySelect.append(`<option value="${subcat}">${subcat}</option>`);
            });
            subcategorySelect.append('<option value="__custom__">+ Add new sub category</option>');
            toggleCustomSubcategoryInput(false);
        }

        function toggleCustomSubcategoryInput(showInput) {
            const customGroup = $("#modal-edit-expense #custom-subcategory-group");
            const customInput = $("#modal-edit-expense #custom-subcategory");
            if (showInput) {
                customGroup.show();
                customInput.prop("disabled", false).prop("required", true).focus();
            } else {
                customGroup.hide();
                customInput.prop("disabled", true).prop("required", false).val("");
            }
        }

        function fillEditModal(row) {
            if (!row) {
                return;
            }
            // Set expense ID for update operation
            $("#modal-edit-expense #expense_id").val(row.id || "");
            
            const categoryVal = row.category || "";
            $("#modal-edit-expense .modal-body #category").val(categoryVal);
            populateSubcategories(categoryVal);

            const currentSubCategory = row.sub_category || "";
            const subcategorySelect = $("#modal-edit-expense .modal-body #sub-category");
            const hasSubCategoryOption = subcategorySelect.find('option').filter(function() {
                return $(this).val() === currentSubCategory;
            }).length > 0;
            if (currentSubCategory && !hasSubCategoryOption) {
                subcategorySelect.append(`<option value="${currentSubCategory}">${currentSubCategory}</option>`);
            }
            
            $("#modal-edit-expense .modal-body #datesingle").val(row.date || "");
            $("#modal-edit-expense .modal-body #amount").val(row.amount || "");
            $("#modal-edit-expense .modal-body #payee").val(row.payee_payer || "");
            $("#modal-edit-expense .modal-body #sub-category").val(currentSubCategory);
            $("#modal-edit-expense .modal-body #method").val(row.payment_method || "");
            $("#modal-edit-expense .modal-body #check-no").val(row.ref_checkno || "");
            $("#modal-edit-expense .modal-body #tag").val(row.tag || "");
            $("#modal-edit-expense .modal-body #tax").val(row.tax || "");
            $("#modal-edit-expense .modal-body #status").val(row.status || "");
            $("#modal-edit-expense .modal-body #description").val(row.description || "");
            toggleCustomSubcategoryInput(false);
        }

        // Populate subcategories when category changes
        $("#modal-edit-expense #category").on("change", function() {
            populateSubcategories($(this).val());
        });

        $("#modal-edit-expense #sub-category").on("change", function() {
            toggleCustomSubcategoryInput($(this).val() === "__custom__");
        });

        var table = $('#expense_table').DataTable( {
            scrollX: true,
		    // "scrollCollapse": true,
		    "fixedColumns":   true,
            "order": [[ 1, "desc" ]],
            buttons: {            
                dom: {
                    button: {
                        className: 'btn btn-light'
                    }
                },
                buttons: [
                    'excelHtml5',
                    'csvHtml5',
                    'pdfHtml5'
                ]
            },
            "paging": true,
            "serverSide": true,
            "processing": true,
            "ajax": {
                // "processing": true,
                "type": "GET",
                "url": "{% url 'ajax_loaddata' %}",
                "dataSrc": "data"
            },
            "columns": [

                    {
                        mRender: function (data, type, row) {
                            var item = '<a data-popup="tooltip" title="Edit Expense" data-toggle="modal" data-target="#modal-edit-expense" class="btn icon-pencil edit-expense"></a>';
                            return item
                        }
                    },
                    { "data": "date", "title": "Date"},
                    { "data": "amount" , "title": "Amount"},
                    { "data": "payee_payer" , "title": "Payee/Payer"},
                    { "data": "category" , "title": "Category"},
                    { "data": "sub_category" , "title": "Sub Category"},
                    { "data": "payment_method" , "title": "Payment Method"},
                    { "data": "description" , "title": "Description"},
                    { "data": "ref_checkno" , "title": "Ref/Check No"},
                    { "data": "status" , "title": "Status"},
                    { "data": "receipt_picture" , "title": "Receipt Picture"},
                    { "data": "account" , "title": "Account"},
                    { "data": "tag" , "title": "Tag"},
                    { "data": "tax" , "title": "Tax"},
                    { "data": "mileage" , "title": "Mileage"}
                ],
        } );

        $('#expense_table tbody').on('click', 'a.edit-expense', function () {
            var tr = $(this).closest('tr');
            var rowData = table.row(tr).data();
            fillEditModal(rowData);
        });

        // Handle form submission with AJAX
        $('#post-form').on('submit', function(e) {
            e.preventDefault();
            if ($('#sub-category').val() === '__custom__' && !$('#custom-subcategory').val().trim()) {
                new PNotify({
                    title: 'Validation Error',
                    text: 'Please enter a custom sub category.',
                    icon: 'icon-warning22',
                    width: '280px',
                    hide: true,
                    addclass: 'alert bg-warning text-black'
                });
                return;
            }
            var formData = $(this).serialize();
            var expenseId = $('#expense_id').val();
            var isEditing = expenseId && expenseId !== '';
            $.ajax({
                type: 'POST',
                url: '/add_expense/',
                data: formData,
                success: function(response) {
                    console.log('Expense saved successfully', response);
                    // Close the modal
                    $('#modal-edit-expense').modal('hide');
                    // Reload the table
                    table.ajax.reload();
                    // Show success notification based on edit or add
                    var messageText = isEditing ? 'Expense updated successfully.' : 'Expense added successfully.';
                    var notice = new PNotify({
                        title: 'Success',
                        text: messageText,
                        icon: 'icon-checkmark',
                        width: '280px',
                        hide: true,
                        addclass: 'alert bg-success text-black'
                    });
                },
                error: function(response) {
                    console.log('Error saving expense', response);
                    var serverError = response && response.responseJSON && response.responseJSON.error;
                    var errorText = serverError || (isEditing ? 'Error updating expense. Please try again.' : 'Error adding expense. Please try again.');
                    var notice = new PNotify({
                        title: 'Error',
                        text: errorText,
                        icon: 'icon-cross2',
                        width: '280px',
                        hide: true,
                        addclass: 'alert bg-danger text-black'
                    });
                }
            });
        });

        $.ajax({
            type: "GET",
            url: '/update_data/',
            dataType: 'json',
            success: function (data) {
                table.ajax.reload();
                console.log(data.new);
                console.log("LENGTH",data.length)
                if (data.new == 'true') {
                    var notice = new PNotify({
                        title: 'New data received',
                        text: 'Data has be updated.',
                        icon: 'icon-file-download',
                        width: '280px',
                        hide: true,
                        addclass: 'alert bg-info text-black'
                    });
                }
            }, 
            error: function(data) {
                console.log("error occurred", data);
            }
        });
    } );

    $('#modal-edit-expense').on('hidden.bs.modal', function(e)
    { 
        // Clear the expense ID for next new entry
        $("#modal-edit-expense #expense_id").val("");
        $("#modal-edit-expense #custom-subcategory-group").hide();
        $("#modal-edit-expense #custom-subcategory").prop("disabled", true).prop("required", false).val("");
        $(this).removeData();
    }) ;
</script>
{% endblock %}
